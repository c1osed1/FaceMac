name: FaceMac
options:
  bundleIdPrefix: com.facemac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FaceMac:
    path: .
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    from: "1.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.0.0"

targets:
  FaceMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/FaceMacApp
      - path: Resources/FaceEmbedding.mlmodelc
        buildPhase: resources
      - path: Resources/FaceID.json
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FaceMac
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSCameraUsageDescription: FaceMac uses the built-in camera to recognise you and unlock the screen.
        NSHumanReadableCopyright: GPL-3.0 licensed
    entitlements:
      path: Resources/FaceMac.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facemac.app
        PRODUCT_NAME: FaceMac
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Sign with a stable identity so macOS TCC (Camera / Accessibility)
        # keeps its grants across rebuilds. Ad-hoc ("-") changes the cdhash on
        # every build and forces the user to re-approve.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: zxckidakoev@icloud.com (9KW4KL9556)"
        DEVELOPMENT_TEAM: "4X82F68BG9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: FaceMac
        product: FaceMacCore
      - package: SkyLightWindow
        product: SkyLightWindow
      - package: Lottie
        product: Lottie
